name: Publish Kotlin package
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: false
        default: "21"
    secrets:
      GH_PACKAGES_USER:
        required: true
      GH_PACKAGES_TOKEN:
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle
      - name: Validate and publish
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ secrets.GH_PACKAGES_USER }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean test publish
