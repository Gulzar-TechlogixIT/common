name: Reusable Kotlin CI
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: false
        default: "21"
      gradle-task:
        type: string
        required: false
        default: "build"
    secrets:
      GH_PACKAGES_USER:
        required: true
      GH_PACKAGES_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle
      - name: Validate Gradle wrapper
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - name: Build and test using published Maven packages
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ secrets.GH_PACKAGES_USER }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GH_PACKAGES_TOKEN }}
          GRADLE_TASK: ${{ inputs.gradle-task }}
        run: ./gradlew --no-daemon "$GRADLE_TASK"
