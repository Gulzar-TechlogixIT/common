name: Reusable Kotlin CI
on:
  workflow_call:
    inputs:
      java-version: {type: string, required: false, default: "21"}
      gradle-task: {type: string, required: false, default: "build"}
    secrets:
      GH_PACKAGES_USER: {required: false}
      GH_PACKAGES_TOKEN: {required: false}
permissions:
  contents: read
jobs:
  validate-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle
      - name: Validate Gradle wrapper
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - name: Configure GitHub Packages credentials
        if: ${{ secrets.GH_PACKAGES_USER != '' && secrets.GH_PACKAGES_TOKEN != '' }}
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          echo "ORG_GRADLE_PROJECT_githubPackagesUsername=$GH_PACKAGES_USER" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_githubPackagesPassword=$GH_PACKAGES_TOKEN" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          GRADLE_TASK: ${{ inputs.gradle-task }}
        run: ./gradlew --no-daemon "$GRADLE_TASK"
